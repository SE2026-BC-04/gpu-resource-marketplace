name: gpu-resource-marketplace

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    networks: [frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 4

  api:
    build:
      context: ./backend
    environment:
      GPU_MARKETPLACE_DATABASE_URL: ${GPU_MARKETPLACE_DATABASE_URL:?Set GPU_MARKETPLACE_DATABASE_URL in .env}
      GPU_MARKETPLACE_CORS_ORIGINS: ${GPU_MARKETPLACE_CORS_ORIGINS:-["http://localhost:5173"]}
      GPU_MARKETPLACE_LOG_LEVEL: ${GPU_MARKETPLACE_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    networks: [app, database]
    depends_on:
      postgres:
        condition: service_healthy

  manager:
    build:
      context: ./backend
    command: ["python", "-m", "gpu_marketplace.manager"]
    environment:
      GPU_MARKETPLACE_DATABASE_URL: ${GPU_MARKETPLACE_DATABASE_URL:?Set GPU_MARKETPLACE_DATABASE_URL in .env}
      GPU_MARKETPLACE_LOG_LEVEL: ${GPU_MARKETPLACE_LOG_LEVEL:-INFO}
    networks: [app, database]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "gpu_marketplace.manager.healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  simulator:
    build:
      context: ./simulator
    environment:
      SIMULATOR_LOG_LEVEL: ${SIMULATOR_LOG_LEVEL:-INFO}
    networks: [app]

  postgres:
    image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpu_marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-gpu_marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  frontend:
    internal: true
  app:
    internal: true
  database:
    internal: true

volumes:
  postgres-data:
